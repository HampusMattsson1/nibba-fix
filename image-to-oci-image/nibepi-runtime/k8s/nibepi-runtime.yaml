apiVersion: apps/v1
kind: Deployment
metadata:
  name: nibepi-runtime
  labels:
    app: nibepi-runtime
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nibepi-runtime
  template:
    metadata:
      labels:
        app: nibepi-runtime
    spec:
      containers:
        - name: nibepi-runtime
          image: localhost/nibepi-runtime:latest
          imagePullPolicy: Never
          env:
            - name: NIBEPI_ELPRIS_TOKEN
              value: "elpris:SE4"
            - name: HTTPS_PROXY
              value: "http://proxy.ltblekinge.org:8080"
          ports:
            - containerPort: 1880
              name: http
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: nibepi-runtime
spec:
  type: NodePort
  selector:
    app: nibepi-runtime
  ports:
    - name: http
      port: 1880
      targetPort: http
      nodePort: 31880
